<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NurseryNet Brand Assets & Logo Viewer</title>
  <style>
    :root {
      --primary: #7C3AED;
      --accent: #F59E0B;
      --bg: #FAFAFC;
      --card: #FFFFFF;
      --text: #0F172A;
      --muted: #64748B;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
    }
    p {
      color: var(--muted);
      font-size: 1rem;
      margin: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }
    .card {
      background: var(--card);
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .logo-box {
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      border-radius: 12px;
      background: #F8FAFC;
      border: 1px solid #EDF2F7;
    }
    .card h3 {
      margin: 0 0 6px 0;
      font-size: 1.2rem;
      font-weight: 700;
    }
    .card span {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: white;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #6D28D9;
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>NurseryNet Brand Assets</h1>
      <p>Official vector emblems and wordmarks for South African schools, press, and partners.</p>
    </div>

    <div class="grid">
      <!-- NurseryNet -->
      <div class="card">
        <div class="logo-box">
          <svg viewBox="0 0 100 100" width="80" height="80">
            <circle cx="50" cy="50" r="45" fill="#7C3AED" />
            <path d="M 30,65 C 30,40 50,25 70,35 C 70,55 50,65 30,65 Z" fill="#F59E0B" />
            <circle cx="62" cy="40" r="4" fill="#FFFFFF" />
          </svg>
        </div>
        <h3>NurseryNet</h3>
        <span>Early Childhood Development</span>
        <button class="btn" onclick="downloadSvg('nurserynet')">Download Vector SVG</button>
      </div>

      <!-- PrimaryNet -->
      <div class="card">
        <div class="logo-box">
          <svg viewBox="0 0 100 100" width="80" height="80">
            <circle cx="50" cy="50" r="45" fill="#0284C7" />
            <rect x="30" y="32" width="40" height="36" rx="4" fill="#FFFFFF" />
            <polygon points="50,20 74,32 26,32" fill="#F59E0B" />
          </svg>
        </div>
        <h3>PrimaryNet</h3>
        <span>Grades R – 7 Foundation</span>
        <button class="btn" onclick="downloadSvg('primarynet')">Download Vector SVG</button>
      </div>

      <!-- HighschoolNet -->
      <div class="card">
        <div class="logo-box">
          <svg viewBox="0 0 100 100" width="80" height="80">
            <circle cx="50" cy="50" r="45" fill="#059669" />
            <polygon points="50,25 76,40 50,55 24,40" fill="#FFFFFF" />
            <rect x="38" y="47" width="24" height="24" fill="#F59E0B" rx="3" />
          </svg>
        </div>
        <h3>HighschoolNet</h3>
        <span>Secondary & Matric Hub</span>
        <button class="btn" onclick="downloadSvg('highschoolnet')">Download Vector SVG</button>
      </div>

      <!-- TertiaryNet -->
      <div class="card">
        <div class="logo-box">
          <svg viewBox="0 0 100 100" width="80" height="80">
            <circle cx="50" cy="50" r="45" fill="#4F46E5" />
            <circle cx="50" cy="50" r="28" fill="none" stroke="#F59E0B" stroke-width="8" />
            <polygon points="50,30 65,58 35,58" fill="#FFFFFF" />
          </svg>
        </div>
        <h3>TertiaryNet</h3>
        <span>Colleges & Universities</span>
        <button class="btn" onclick="downloadSvg('tertiarynet')">Download Vector SVG</button>
      </div>
    </div>

    <div style="text-align: center;">
      <a href="/" class="back-link">&larr; Return to NurseryNet Home</a>
    </div>
  </div>

  <script>
    function downloadSvg(name) {
      const svgs = {
        nurserynet: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#7C3AED"/><path d="M 30,65 C 30,40 50,25 70,35 C 70,55 50,65 30,65 Z" fill="#F59E0B"/><circle cx="62" cy="40" r="4" fill="#FFFFFF"/></svg>',
        primarynet: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#0284C7"/><rect x="30" y="32" width="40" height="36" rx="4" fill="#FFFFFF"/><polygon points="50,20 74,32 26,32" fill="#F59E0B"/></svg>',
        highschoolnet: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#059669"/><polygon points="50,25 76,40 50,55 24,40" fill="#FFFFFF"/><rect x="38" y="47" width="24" height="24" fill="#F59E0B" rx="3"/></svg>',
        tertiarynet: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#4F46E5"/><circle cx="50" cy="50" r="28" fill="none" stroke="#F59E0B" stroke-width="8"/><polygon points="50,30 65,58 35,58" fill="#FFFFFF"/></svg>'
      };

      const content = svgs[name] || svgs.nurserynet;
      const blob = new Blob([content], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name + '-logo.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
